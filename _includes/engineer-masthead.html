<section class="engineer-masthead" aria-labelledby="masthead-title">
  <div class="engineer-masthead__inner shell">
    <p class="engineer-masthead__eyebrow">{{ include.eyebrow | default: "Min-Gi Kim" }}</p>
    <h1 class="engineer-masthead__title" id="masthead-title">{{ include.title | default: page.title }}</h1>
    <div class="engineer-masthead__signal" aria-hidden="true"></div>
    {% if include.context %}<p class="engineer-masthead__context">{{ include.context }}</p>{% endif %}
  </div>
</section>
