---
layout: default
---
<article class="page-shell shell">
  <header class="page-shell__header">
    {% if page.eyebrow %}
      <p class="primitive-label">{{ page.eyebrow }}</p>
    {% endif %}
    <h1 class="page-shell__title">{{ page.title }}</h1>
  </header>
  <div class="page-shell__body">
    {{ content }}
  </div>
</article>
