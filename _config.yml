title: Min-Gi Kim
description: RF/Antenna Systems Tech Notes
markdown: kramdown

url: "https://swallow-kim.github.io"
baseurl: ""

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

collections:
  notes:
    output: true
    sort_by: chapter

defaults:
  - scope:
      path: ""
      type: notes
    values:
      layout: note

exclude:
  - _config.qa.yml
  - Gemfile
  - Gemfile.lock
  - node_modules
  - package-lock.json
  - package.json
  - Rakefile
  - README.md
  - scripts
  - qa
  - vendor
